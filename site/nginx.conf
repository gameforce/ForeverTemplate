# The container runs on the host network (see docker-compose.yml) so $remote_addr is the real visitor, not Docker's gateway.
# One shared zone for per-client rate limiting (this file is included inside nginx's http block).
limit_req_zone $binary_remote_addr zone=perip:10m rate=10r/s;

server {
    listen 8085;
    server_name gameforce.ca www.gameforce.ca _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 1k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    send_timeout 10s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    limit_req zone=perip burst=30 nodelay;

    # Static site: read-only methods only.
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    location ~ /\. {
        return 404;
    }
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
    }
    location / {
        try_files $uri $uri/ =404;
    }
}
